seqspec_version: 0.3.0
assay_id: getrpf_inferred
name: get-RPF inferred read structure
modalities:
- rna
sequence_spec:
- region_id: nta_0
  region_type: linker
  sequence_type: random
  min_len: 0
  max_len: 1
  getrpf:
    type: nta
    frame: read_start
    keep_as_umi: false
    remove: false
    status: interval
    note: non-templated-like in about 46% of reads; kept (v1)
- region_id: insert_1
  region_type: cdna
  sequence_type: joined
  min_len: 20
  max_len: 40
  getrpf:
    type: insert
    frame: read_start
    keep_as_umi: false
    remove: false
    status: interval
    note: accepted under monosome_20_40
getrpf:
  source: inferred
  status: interval
  fragment_policy: monosome_20_40
  describe: '[nta 0-1 kept][insert]'
  transform:
    emit: true
    bound: interval
    reasons: []
    conventions:
    - 'trimmed input: the read end is the anchor'
    - 'Q2: 1 junction base(s) at the read start kept in the insert (non-templated-like
      in about 46% of reads; v1 does not remove them)'
