# Gold set v1 for the real-library panel (docs/read_structure_inference_spec.md §10.2).
#
# Rules
# - Every protocol claim names its scope (run, sample, series, study, vendor) and its source.
# - "unknown" means unknown. Nothing is false because a field is empty.
# - Protocol claims, observed read structure and expected RPF output are separate fields.
# - Values get-RPF measured itself are listed under `observed` with the method and date,
#   never mixed with published claims.
# - `expected_structure` entries marked "derived" follow from the construction chemistry
#   and are hypotheses until observed.
#
# - `benchmark` blocks are regression expectations for scripts/run_structure_panel.py.
#   They were written from the 2026-09-13 measurements, so a pass shows the method
#   still reproduces them; it is not independent evidence. The independent checks are
#   the expectations written before analysis in tests/test_structure/test_real_panel.py
#   and test_real_extraction.py (held-out reads).
#
# Read subsets: scripts/fetch_panel_subsets.sh (first 1M reads per run from ENA).
# "steps 0-3" below = getRPF.core.structure.assemble.infer_structure on the first
# 300k of those reads (tests/test_structure/test_real_panel.py).

runs:
  - run: SRR1944950
    study: PRJNA279785 (GEO GSE67387; Nedialkova & Leidel 2015, doi:10.1016/j.cell.2015.05.022)
    sample: GSM1646053 WT_ribo_rapamycin_rep3
    layout: single
    read_length: variable, 25-45 nt (mode 31)
    input_state: trimmed
    protocol_claims:
      - claim: 3' linker ligation, reverse transcription, circularisation; 28-32 nt footprints gel-selected
        scope: series
        source: GEO GSE67387 extract protocol
      - claim: 3' adapter sequences removed with FASTX-toolkit before deposit
        scope: series
        source: GEO GSE67387 data processing
      - claim: UMI or randomised bases
        value: unknown
        scope: none found
        source: none
    observed:
      - finding: reads are already footprint-length; no adapter to anchor on
        method: get-RPF audit, 500k reads, 2026-09-13
      - finding: ">=0.93 within-fragment agreement at every position except read position 1 (0.64); 60% of the disagreeing first bases are T"
        interpretation: candidate 5' non-templated base in a large fraction of reads; unconfirmed
        method: library-as-reference pileup, first 300k reads, 2026-09-13 (reproduced by steps 0-3)
    expected_structure: "[insert] (+ candidate 1 nt 5' NTA in some reads)"
    expected_rpf_output: reads kept unchanged within the fragment policy; the candidate NTA is reported, not removed (v1)
    benchmark:
      # The historical protocol UMI claim is unknown and is not observable in
      # this already-trimmed FASTQ. It must not enter UMI false-negative rates.
      layout: insert
      adapter: false
      tail: null
      transform: emit
      umi: {state: not_observable}
      min_accepted_fraction: 0.50
    corrections: the WIP gold claimed "5 nt linker UMI + 2 random RT-primer bases" by quoting McGlincy & Ingolia 2017, which is a different study. Withdrawn.

  - run: SRR3945920
    study: PRJNA330982 (GEO GSE84746; Lecanda et al. 2016, doi:10.1016/j.ymeth.2016.07.011)
    sample: GSM2249616 DualLigation_RibosomeProfiling_rep1
    layout: single
    read_length: 50 nt
    input_state: raw_fixed_length
    protocol_claims:
      - claim: dual-ligation library, one of the library strategies the paper compares
        scope: sample (title) and study (abstract)
        source: GEO GSM2249616 title; Lecanda et al. 2016 abstract
      - claim: randomised bases in this sample's adapters
        value: unknown
        scope: not stated at sample level
        source: none
    observed:
      - finding: TruSeq adapter AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC starts at read positions 28-31 in most reads; 95.6% of 50k sampled reads end in an adapter prefix
        method: get-RPF retry audit (validation_rewire_v1 bounded_retry1), 2026-09-13
      - finding: "truseq_3p located in 99% of reads, start mode position 31 (5-95%: 26-32); read start: no technical bases (agreement 0.93 at position 1); before the adapter: no technical bases, position 1 at intermediate agreement 0.87 (a non-templated-like base in about 16% of reads, 50% C among disagreeing bases)"
        method: steps 0-3, 2026-09-13
    expected_structure: "measured: [insert][adapter]; candidate 3' NTA in ~16% of reads"
    expected_rpf_output: the bases before the adapter; the candidate 3' NTA is reported, not removed (v1)
    benchmark:
      # This sample has no run-scoped randomized-base claim. Score its direct
      # adapter observation, not the withdrawn study-level 4+3N annotation.
      layout: insert|adapter
      adapter: true
      tail: null
      transform: emit
      umi: {state: not_observable}
      min_accepted_fraction: 0.50
    corrections: the WIP gold labelled this run distributed_umi (4+3N) from a study-level claim. That design belongs to SRR3945930. Withdrawn.

  - run: SRR3945930
    study: PRJNA330982 (GEO GSE84746; Lecanda et al. 2016, doi:10.1016/j.ymeth.2016.07.011)
    sample: SRX1971815 4+3N_RibosomeProfiling_rep1
    layout: single
    read_length: 45 nt
    input_state: raw_fixed_length
    protocol_claims:
      - claim: DNA linker carrying four randomised positions at its 5' end; RT primer carrying three randomised positions
        scope: sample (the "4+3N" title names this design) and study (abstract)
        source: Lecanda et al. 2016 abstract (PubMed 27450428); GEO sample title
    observed:
      - finding: "linker CTGTAGGCACCATCAAT (catalogue ingolia_linker_3p) located in 38% of reads: 45 nt reads show >=10 nt of it only for the shorter inserts. Read start: 3 random positions (agreement 0.31-0.36), position 4 intermediate (0.84, ~21% non-templated-like), biology from position 5 (0.98). Before the linker: 4 random positions (0.28-0.56), biology from position 5 (0.99)"
        method: steps 0-3, 2026-09-13
    expected_structure: "derived and now observed: [3 random][insert][4 random][linker CTGTAGGCACCATCAAT]. Circularisation puts the RT primer's randomised bases at the read start; the linker's sit between insert and adapter"
    expected_rpf_output: the insert without the 3 + 4 randomised bases, both kept as UMI
    benchmark:
      layout: random:3|insert|random:4|adapter
      adapter: true
      tail: null
      transform: emit
      umi: {state: observed, five_prime: [3], three_prime: [4]}
      min_accepted_fraction: 0.05
    corrections: new row; the distributed-randomisation case for the panel

  - run: SRR12693498
    study: PRJNA665035 (GEO GSE158374)
    sample: GSM4798525 WT-HEK-1_ribo
    layout: single
    read_length: 100 nt
    input_state: raw_fixed_length
    protocol_claims:
      - claim: D-Plex Small RNA-Seq kit (Diagenode) - 3' dephosphorylation, 5' UMI, template-switching reverse transcriptase
        scope: sample
        source: GEO GSM4798525 extract protocol
      - claim: 12 nt UMI at the read 5' end, followed by a template-switch motif; A-tail at the 3' side
        scope: vendor
        source: Diagenode D-Plex recommendations as quoted in the WIP panel; not re-verified
    observed:
      - finding: all reads are 100 nt; 57.4% of 50k sampled reads end in a TruSeq adapter prefix (the read-end-only matcher undercounts reads where the adapter is mid-read)
        method: hpc_audit_v3 audit, 2026-09
      - finding: "truseq_3p located in 90% of reads (start mode position 70), preceded by a poly(A) run in 100% of anchored reads; P7 follows the adapter in 72% of reads long enough to show it. Read start: 13 random positions (agreement 0.21-0.45), then GGG at positions 14-16 (97-99% G, fixed), biology from position 17 (0.96). Before the tail: no technical bases; position 1 intermediate (0.87, ~16% non-templated-like, 47% C)"
        method: steps 0-3, 2026-09-13
    expected_structure: "observed, consistent with the vendor claim and the riboflow_template_switch template: [12 nt UMI + N][GGG][insert][A-run][TruSeq adapter]"
    expected_rpf_output: the insert between the 16 nt 5' block and the A-run, UMI kept; tail junction reported as an interval (spec §6)
    benchmark:
      # The FASTQ evidence resolves 13 random bases (the named 12 nt UMI plus
      # one adjacent random base); score that observable boundary, not the
      # vendor's protocol shorthand.
      layout: random:13|fixed:GGG|insert|tail:A|adapter
      adapter: true
      tail: A
      transform: emit
      umi: {state: observed, five_prime: [13], three_prime: []}
      min_accepted_fraction: 0.50
    corrections: none to the claim; the WIP runs produced zero RPFs because adapter matching was read-end-only

  - run: SRR23242345
    study: PRJNA928376
    sample: SRX19188681 "RNase I ribosome profiling by OTTR of HEK293T cell lysate"
    layout: single (ENA)
    read_length: 101 nt
    input_state: raw_fixed_length
    protocol_claims:
      - claim: 7 nt UMI at the 5' end, TruSeq adapter, last base removed during processing (which end is not stated in the quote)
        scope: study
        source: PMC10659435 as quoted in the WIP panel; not re-verified
    observed:
      - finding: all reads are 101 nt; 81.8% of 50k sampled reads end in the Illumina P7 sequence ATCTCGTATGCC..., so the adapter lies mid-read
        method: hpc_audit_v3 audit, 2026-09
      - finding: "truseq_3p located in 98% of reads (start mode position 37), whole adapter in 100% of them, P7 following in 89%. Read start: 5 random positions (agreement 0.24-0.29, even base mix), then positions 6-7 skewed with intermediate agreement (60% T at 0.42; 78% C at 0.69), biology from position 8 (0.93). Before the adapter: no technical base (0.96 at position 1, 0.99 further in)"
        interpretation: "the published 7 nt trim ends where biology starts, but positions 6-7 are not random, so the read start is 5 random bases + 2 biased bases rather than a 7 nt UMI. The quoted 'last base removed' is not visible as a 3' block in R1. Both need the OTTR methods text re-read before either is treated as settled"
        method: steps 0-3, 2026-09-13
    expected_structure: "claimed [7 nt UMI][insert][TruSeq adapter]; measured [5 random][2 biased][insert][TruSeq adapter]"
    expected_rpf_output: "the insert from position 6 to the adapter, positions 6-7 kept and flagged (spec §7.2, revised 2026-09-14: junction bases never withhold); the 5 random bases kept as UMI"
    benchmark:
      layout: random:5|insert|adapter
      adapter: true
      tail: null
      transform: emit
      umi: {state: observed, five_prime: [5], three_prime: []}
    corrections: the WIP rewire guide excluded this run as paired-end; ENA lists it as single-end. The 7 nt UMI claim is contradicted by the base composition at positions 6-7 (see observed)

to_source:
  - need: a McGlincy & Ingolia 2017-style run (5 nt random + 5 nt inline barcode between insert and adapter)
    why: the only panel case with a 3' UMI and an inline barcode
