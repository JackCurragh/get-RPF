[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Lowercase deliberately (REPO_CONTRACT.md 5.3). PyPI rejects a wheel whose
# filename is not the normalised project name, with a 400 at upload that
# `twine check` does not catch -- it killed three translonscorer releases.
# hatchling normalised the filename on its own; setuptools does not, so the
# name and the CI filename assertion have to land together with the backend
# swap. The import package and the console script stay `getRPF`.
name = "getrpf"
version = "0.3.1"
description = "A tool for analyzing Ribosome Protected Fragments (RPFs) from Ribo-seq experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["bioinformatics", "ribo-seq", "RPF", "sequence-analysis"]
authors = [
    { name = "Jack Tierney", email = "jackcurragh@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "biopython>=1.79",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "pysam>=0.19.0",
    "matplotlib>=3.7",
    "duckdb>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.900",
    "ruff>=0.0.270",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.scripts]
getRPF = "getRPF.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["getRPF", "getRPF.*"]

# The architecture YAMLs are runtime package data, read through
# importlib.resources.files("getRPF") in
# core/processors/rpf_extractor.py:_init_builtin_architectures. hatchling
# shipped every file under the package directory; setuptools ships only
# Python modules unless told otherwise, so name them explicitly.
[tool.setuptools.package-data]
"getRPF" = ["architectures/*.yaml", "architectures/*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=getRPF"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order. `I` is why isort is not a
# dependency here -- ruff replaces both flake8 and isort (REPO_CONTRACT.md 4b).
select = ["E", "F", "I", "W"]
extend-ignore = ["E501"]  # line length is black's job
# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pixi.project]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.10.*"
pip = "*"
star = ">=2.7.10a"
samtools = ">=1.15"
click = "*"
biopython = "*"
numpy = "*"
pyyaml = "*"
pysam = "*"
matplotlib-base = "*"
duckdb = "*"
