seqspec_version: 0.3.0
assay_id: getrpf_inferred
name: get-RPF inferred read structure
modalities:
- rna
sequence_spec:
- region_id: insert_0
  region_type: cdna
  sequence_type: joined
  min_len: 20
  max_len: 40
  getrpf:
    type: insert
    frame: read_start
    keep_as_umi: false
    remove: false
    status: interval
    note: accepted under monosome_20_40
- region_id: nta_1
  region_type: linker
  sequence_type: random
  min_len: 0
  max_len: 1
  getrpf:
    type: nta
    frame: anchor
    keep_as_umi: false
    remove: false
    status: interval
    note: non-templated-like in about 16% of reads; kept (v1)
- region_id: adapter_2
  region_type: adapter
  sequence_type: fixed
  min_len: 34
  max_len: 34
  sequence: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
  getrpf:
    type: adapter
    frame: anchor
    keep_as_umi: false
    remove: true
    status: resolved
    note: truseq_3p (catalogue)
getrpf:
  source: inferred
  status: interval
  fragment_policy: monosome_20_40
  describe: '[insert][nta 0-1 kept][adapter AGATCGGAAGAG...]'
  transform:
    emit: true
    bound: interval
    reasons: []
    conventions:
    - 'Q3: 1 junction base(s) at the anchor kept in the insert (non-templated-like
      in about 16% of reads; v1 does not remove them)'
