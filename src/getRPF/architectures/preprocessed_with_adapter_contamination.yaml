seqspec_version: "0.3.0"
assay_id: "preprocessed_with_adapter_contamination"
name: "Preprocessed (Contaminated)"
description: "Partially processed reads that still contain adapter sequences"
library_kit: "Partially processed ribosome profiling reads"
modalities: ["rna"]
sequence_spec:
  - region_id: rpf
    region_type: cdna
    sequence_type: joined
    min_len: 25
    max_len: 40
  - region_id: adapter
    region_type: adapter
    sequence: AGATCGGAAGAGCAC
    min_len: 15
    max_len: 15
quality_markers:
  adapter_match_threshold: 0.2
