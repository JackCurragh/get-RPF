name: Build and Push Container

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jackcurragh/get-rpf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test pushed image CLI
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$image" getRPF --version
          docker run --rm "$image" getRPF extract --help | tee /tmp/getrpf_extract_help.txt
          docker run --rm "$image" getRPF extract-rpf --help | tee /tmp/getrpf_extract_rpf_help.txt
          for help_file in /tmp/getrpf_extract_help.txt /tmp/getrpf_extract_rpf_help.txt; do
            grep -q -- "--format" "$help_file"
            grep -q -- "--generate-seqspec" "$help_file"
            grep -q -- "--output-format" "$help_file"
            grep -q -- "--star-index" "$help_file"
            grep -q -- "--star-threads" "$help_file"
            grep -q -- "--collapsed-only" "$help_file"
          done
