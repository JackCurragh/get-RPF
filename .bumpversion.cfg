[bumpversion]
current_version = 0.3.1
commit = True
tag = True
tag_name = v{new_version}
message = Bump version: {current_version} → {new_version}

[bumpversion:file:src/getRPF/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

# CITATION.cff carries its own version field and is the one that gets
# forgotten -- TranslonScorer's said 0.1.1 while the package was at 0.3.1,
# three releases of drift. A citation record with the wrong version is a
# correctness bug (REPO_CONTRACT.md 5.2). date-released is NOT bumped
# automatically (bump2version has no date support); update it with the
# changelog when cutting a release.
[bumpversion:file:CITATION.cff]
search = version: {current_version}
replace = version: {new_version}
